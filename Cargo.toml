[package]
name = "snaptr"
version = "0.2.0"
edition = "2021"

[dependencies]
ab_glyph = "0.2"
ureq = "2"
serde_json = "1"
winit = "0.30"
softbuffer = "0.4"
global-hotkey = "0.9"
parking_lot = "0.12"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr", "image"] }
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
